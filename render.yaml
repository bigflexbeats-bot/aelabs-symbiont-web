services:
  - type: web
    name: aelabs-symbiont-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GITHUB_OWNER
        value: bigflexbeats-bot
      - key: GITHUB_REPO
        value: aelabs-symbiont-data
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ANALYTICS_ADMIN_PASSWORD
        sync: false
      - key: ANALYTICS_TIMEZONE
        value: Europe/Moscow

      - key: GITHUB_LOG_OWNER
        sync: false
      - key: GITHUB_LOG_REPO
        sync: false
      - key: GITHUB_LOG_BRANCH
        value: main
      - key: GITHUB_LOG_PATH
        value: data/log/aelabs_log.csv
      - key: GITHUB_LOG_TOKEN
        sync: false
